# Builds the playtest page (npm run build:playtest → dist/TUMULT.playtest.html) from every push to
# development and keeps it as a downloadable file on the run, named with the version and commit.
#
# The claude.ai playtest artifact cannot be published from GitHub: a Claude session republishes it
# from this build with the /playtest-publish skill (.claude/skills/playtest-publish/SKILL.md), which
# keeps the artifact's link and its shared store. The run's summary says what to do.
name: Playtest build

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:playtest
      - id: name
        run: echo "name=TUMULT.playtest-$(node -p "require('./package.json').version")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/TUMULT.playtest.html
          if-no-files-found: error
          retention-days: 90
      - run: |
          {
            echo "Built ${{ steps.name.outputs.name }} from ${GITHUB_REF_NAME}."
            echo
            echo "To put it on the claude.ai playtest page, ask a Claude session in this repository to run /playtest-publish."
          } >> "$GITHUB_STEP_SUMMARY"

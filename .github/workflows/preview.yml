# A Cloudflare Pages preview of the web version for every pull request and every push to
# bleeding-edge, so the team can play a change from a link before it merges.
#
# One-time setup (an admin): a Cloudflare Pages project named "tumult" (Direct Upload), and two
# repository secrets, CLOUDFLARE_API_TOKEN (scoped to "Cloudflare Pages: Edit" on that account
# only) and CLOUDFLARE_ACCOUNT_ID. Until both exist the deploy step is skipped and the job passes.
# Pull requests from forks never get the secrets, so they build but do not deploy.
#
# The link appears on the pull request as the "preview" environment's deployment.
name: Preview

on:
  pull_request:
  push:
    branches: [bleeding-edge]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:web
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set; skipping the preview deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # wrangler is pinned to an exact version; bump it deliberately.
          npx --yes wrangler@4.42.0 pages deploy dist/web --project-name tumult --branch "$BRANCH" \
            --commit-hash "${{ github.event.pull_request.head.sha || github.sha }}" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

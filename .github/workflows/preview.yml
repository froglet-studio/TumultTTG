# A Cloudflare Pages preview of the web version for every pull request and every push to
# bleeding-edge, so the team can play a change from a link before it merges.
#
#   bleeding-edge      https://tumult.pages.dev (the project's production branch)
#   a pull request     https://<branch name, "/" as "-">.tumult.pages.dev, also on the PR as
#                      the "preview" deployment
#
# One-time setup (an admin, docs/reference/HOSTING.md): two repository secrets,
# CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages: Edit, Froglet's account only) and
# CLOUDFLARE_ACCOUNT_ID. The first deploy creates the Pages project "tumult" itself. Until both
# secrets exist the deploy step is skipped and the job passes. Pull requests from forks never get
# the secrets, so they build but do not deploy.
#
# The players' site is GitHub Pages (pages.yml); nothing here reaches tumult.froglet.games.
name: Preview

on:
  pull_request:
  push:
    branches: [bleeding-edge]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:web
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set; skipping the preview deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # wrangler is pinned to an exact version; bump it deliberately.
          # Creates the project on the first run; afterwards this says it exists and carries on.
          npx --yes wrangler@4.42.0 pages project create tumult --production-branch bleeding-edge \
            || echo "Using the existing Pages project."
          npx --yes wrangler@4.42.0 pages deploy dist/web --project-name tumult --branch "$BRANCH" \
            --commit-hash "${{ github.event.pull_request.head.sha || github.sha }}" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

# The fallback address: publishes main's web version (npm run build:web → dist/web) to this
# repository's own GitHub Pages site, https://froglet-studio.github.io/TumultTTG/, with the offline
# single file beside it at /TUMULT.html.
#
# Players get the game from the Froglet website (site.yml, www.froglet.games/tumult/play/); this is
# for when that cannot be used. Manual only: "Run workflow" on the Actions tab, on main.
# Admin setup, once (docs/reference/HOSTING.md): Settings → Pages → Source "GitHub Actions", and main
# allowed in the github-pages environment. No custom domain.
name: Publish fallback build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      - run: cp -r dist/web _site && cp dist/TUMULT.html _site/TUMULT.html
      # Versions as documented in the two actions' READMEs (checked 2026-11), pinned to commit SHAs;
      # bump the pair together, SHA and version comment both.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site/

  deploy:
    needs: build
    # Only main is published; a run started from another branch builds and stops here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

# Publishes the web version (npm run build:web → dist/web: a small page plus content-named,
# cacheable files) to GitHub Pages at https://tumult.froglet.games, with the offline single file
# beside it at /TUMULT.html.
#
# Every push to main publishes, so a release is a promotion of development to main
# (docs/BRANCHING_AND_RELEASE.md). "Run workflow" on the Actions tab republishes main by hand.
# Admin setup, once (docs/reference/HOSTING.md): Settings → Pages → Source "GitHub Actions",
# custom domain tumult.froglet.games, and main allowed in the github-pages environment.
name: Publish playable build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      # CNAME records the domain beside the files; with an Actions deploy, the domain set in
      # Settings → Pages is the one that counts, so keep the two the same.
      - run: |
          cp -r dist/web _site
          cp dist/TUMULT.html _site/TUMULT.html
          echo tumult.froglet.games > _site/CNAME
      # Versions as documented in the two actions' READMEs (checked 2026-11), pinned to commit SHAs;
      # bump the pair together, SHA and version comment both.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site/

  deploy:
    needs: build
    # Only main is ever live; a run started from another branch builds and stops here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

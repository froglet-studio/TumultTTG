<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="generator" content="tumult-ttg __VERSION__" />
    <meta name="description" content="Tumult: a character-driven tabletop game about completing missions on Tumult." />
    <meta name="theme-color" content="#04070f" />
    <title>__TITLE__</title>
    <!-- The page's own colours, so the first paint is the game's night sky and not a white flash -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #04070f;
        color: #cfe3f0;
      }
      .boot {
        font:
          600 14px/1.4 system-ui,
          sans-serif;
        letter-spacing: 0.2em;
        text-align: center;
        padding-top: 40vh;
        opacity: 0.6;
      }
    </style>
    <!--__HEAD__-->
  </head>
  <body>
    <div id="app"><div class="boot">TUMULT</div></div>
    <noscript><p class="boot">Tumult needs JavaScript to play.</p></noscript>
    <script>
      // Keep the game's files for offline play and faster return visits (sw.js). Only on https or
      // localhost, where browsers allow a service worker; a page opened from disk simply skips it.
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
        addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    </script>
  </body>
</html>

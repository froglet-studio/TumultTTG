- {from: arc.friends, to: sitting, kind: cross, why: A game in the lobby pulls you into a sitting., handoff: pull}
- {from: era.release, to: sitting, kind: cross, why: A release brings new traits and pages., handoff: new}
- {from: breath, to: expedition, kind: cross, why: 'The same pilot, a harder wind.', handoff: done, in: x}
- {from: reward, to: arc.pilot, kind: feed, why: Points spent on P and E stay with a made pilot., handoff: spend}

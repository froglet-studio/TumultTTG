- id: arc.pilot
  parent: era
  at: 3
  core: true
  name: A pilot grows
  tier: 6
  kind: loop
  t: [86400, 2592000]
  is: A made pilot comes home with its traits, points and level, and sets out again as it came home.
  phases:
  - n: Make or choose the pilot
  - n: Fly an expedition
  - n: Come home with traits and points
  - n: Swap traits past nine
  - n: Choose it again
  drivers: [own, mastery, make]
  now:
    s: built
    note: Since 2.76; missions scale to the pilot's level (docs/reference/SCALING.md).
  plan:
    note: 'Design/06: the dossier records who the pilot is and what it did; three-pilot squads.'
  holes:
  - 'on': np
    q: The pilot keeps cards and points but nothing of what it did, so the workshop job stops at the build.
    fill: 'The dossier (P7): each expedition writes one line about the pilot from the faces it played and the canon its
      player wrote.'
  src:
  - docs/reference/RUN_AND_ECONOMY.md Pilots keep their growth
  - docs/design/06-pilots-and-backstory.md
  prop:
    s: change
    note: 'Steward 2026-11-23, from PETS.md (2.133, PR #178): upgrade points now also awaken a pet''s Ethereal faces, so
      a pilot''s growth is split between its traits and its pets. Measure how often the look-ahead player spends on the
      pet (tools/sim.js 40) before calling it a real choice.'
- id: arc.canon
  parent: era
  at: 3
  name: Canon from play
  tier: 6
  kind: loop
  t: [3600, 2592000]
  is: Players add or correct details of places, pilots, foes and events; each answer becomes a canon record for approval.
  phases:
  - n: A question at a pause, or a mark on a text
  - n: The player answers or corrects
  - n: A record is proposed
  - n: The lore lead approves
  - n: It reaches the storyteller pack
  drivers: [make, story]
  now:
    s: built
    note: Marks on atlas, codex and events; questions after the draft and after a mission (docs/reference/CANON.md).
  prop:
    s: change
    note: 'A question names a keyword moment: "Your Pull dragged the Brute into the flood. What did the crowd shout?"'
  src: [docs/reference/CANON.md]
